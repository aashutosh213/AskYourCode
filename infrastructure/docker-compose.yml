version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: askyourcode-postgres
    environment:
      POSTGRES_DB: askyourcode
      POSTGRES_USER: askyourcode
      POSTGRES_PASSWORD: askyourcode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: askyourcode-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: askyourcode-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
