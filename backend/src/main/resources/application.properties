spring.application.name=askyourcode-backend

# PostgreSQL is the normal local runtime store. Override these values through
# environment variables when using a different local installation.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/askyourcode}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:askyourcode}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:askyourcode}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Ollama local models
ollama.url=http://localhost:11434
ollama.embedding.model=nomic-embed-text
ollama.chat.model=qwen2.5-coder:1.5b

# Qdrant OSS Vector DB properties
qdrant.enabled=true
qdrant.url=http://localhost:6333
