# Tests remain self-contained and do not require PostgreSQL or Qdrant.
# A unique database per Spring context: cached contexts that share one in-memory
# database let a later context's create-drop reset ID sequences that an earlier
# context is still allocating from, producing primary-key collisions.
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
qdrant.enabled=false
ollama.embedding.fallback-enabled=true
